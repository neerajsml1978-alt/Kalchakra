<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <style>
        /* कंटेनर जो टीकर बॉक्स को व्यवस्थित करता है */
        .container {
            display: flex;
            gap: 10px;
            width: 100%;
            box-sizing: border-box;
            padding: 5px;
            margin: 0 auto;
            max-width: 900px;
        }

        /* टीकर बॉक्स की स्टाइलिंग */
        .ticker-box { 
            flex: 1; 
            min-width: 0; 
            overflow: hidden; 
            border: 1px solid #ddd; 
            border-radius: 12px; 
            padding: 8px 0; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); 
            white-space: nowrap;
            background-color: #ffffff;
        }
        
        .ticker-move { 
            display: inline-block;
            padding-left: 100%;
            animation: marquee 15s linear infinite; 
        }
        
        .ticker-item { 
            font-weight: bold; 
            font-size: 13px; 
            color: #c82333; 
            text-decoration: none; 
            cursor: pointer; 
            display: block;
        }
        
        @keyframes marquee { 
            0% { transform: translate(0, 0); } 
            100% { transform: translate(-100%, 0); } 
        }
    </style>
</head>
<body>

<div class="container">
    <!-- बॉक्स 1: राशिफल -->
    <div class="ticker-box">
        <div class="ticker-move">
            <a href="./rashifal/rashifal.html" class="ticker-item">✦आज का राशिफल✦</a>
        </div>
    </div>

    <!-- बॉक्स 2: उपाय -->
    <div class="ticker-box">
        <div class="ticker-move">
            <a href="./rashifal/upay.html" class="ticker-item">✦आज के अचूक उपाय✦</a>
        </div>
    </div>

    <!-- बॉक्स 3: पंचांग (यहाँ डेट पिकर ट्रिगर होगा) -->
    <div class="ticker-box">
        <div class="ticker-move">
            <!-- hiddenDatePicker का उपयोग कैलेंडर खोलने के लिए -->
            <input type="date" id="hiddenDatePicker" style="display:none;" onchange="redirectToPanchang(this.value)">
            <a href="javascript:void(0);" class="ticker-item" onclick="document.getElementById('hiddenDatePicker').showPicker();">✦आज का पंचांग✦</a>
        </div>
    </div>
</div>

<script>
    // तारीख चुनने पर यह फंक्शन सीधे API को कॉल कर देगा (चाहे कोई भी तारीख हो)
    function redirectToPanchang(selectedDate) {
        if (!selectedDate) return;

        // अब हम चेक नहीं करेंगे कि तारीख आज की है या नहीं, 
        // बल्कि हर तारीख के लिए सीधा API फंक्शन चला देंगे।
        fetchPanchangByDate(selectedDate);
    }

    // यह फंक्शन किसी भी चुनी हुई तारीख के लिए API से डेटा लाएगा
        function fetchPanchangByDate(selectedDate) {
        const selectedDateStr = selectedDate; // जैसे: '2026-08-13'
        const container = document.getElementById('script-container') || document.body;

        if (!selectedDateStr) return;

        container.innerHTML = `<p style='text-align: center; color: #2575fc; font-weight: bold; margin-top: 100px;'>⏳ API से ${selectedDateStr} का पंचांग लोड हो रहा है...</p>`;

        // यहाँ अपनी Prokerala की Client ID और Client Secret डालें
        const clientId = '6a813a7c-c5e4-465f-a533-c95daee4dfb6';
        const clientSecret = 'oUoyvCLzB45mzIuNZTbEw8aMHn16MCpHUsRsp75O';
        
        // प्रोकेराला पंचांग का सही API एंडपॉइंट (लोकेशन कोऑर्डिनेट्स के साथ, जैसे नई दिल्ली)
        const apiUrl = `https://api.prokerala.com/v2/astrology/panchang?client_id=${clientId}&client_secret=${clientSecret}&ayanamsa=1&coordinates=28.6139,77.2090&datetime=${selectedDateStr}T00:00:00Z&la=hi`;

        fetch(apiUrl)
            .then(response => {
                if (!response.ok) throw new Error("API से डेटा प्राप्त करने में विफल");
                return response.json();
            })
            .then(data => {
                // डेटा मिलने पर यहाँ स्क्रीन पर दिखाएं
                const panchang = data.data; // प्रोकेराला के स्ट्रक्चर के अनुसार
                container.innerHTML = `
                    <div style="font-family: sans-serif; color: #333; padding: 10px;">
                        <h2 style="color: #b30000; text-align: center;">📅 पंचांग (${selectedDateStr})</h2>
                        <hr style="border: 0; border-top: 1px solid #ccc; margin-bottom: 15px;">
                        
                        <p><strong>तिथि:</strong> ${panchang.tithi[0].name || 'उपलब्ध नहीं'}</p>
                        <p><strong>नक्षत्र:</strong> ${panchang.nakshatra[0].name || 'उपलब्ध नहीं'}</p>
                        
                        <h3 style="color: #6a11cb; margin-top: 20px;">☀️ सूर्योदय और सूर्यास्त</h3>
                        <p><strong>सूर्योदय:</strong> ${panchang.sunrise || 'एन/ए'}</p>
                        <p><strong>सूर्यास्त:</strong> ${panchang.sunset || 'एन/ए'}</p>
                    </div>
                `;
            })
            .catch(error => {
                container.innerHTML = `
                    <div style="text-align: center; padding: 40px;">
                        <h3 style="color: #e74c3c;">डेटा लोड करने में त्रुटि</h3>
                        <p style="color: #555;">कृपया अपनी इंटरनेट कनेक्शन या API क्रेडेंशियल्स की जाँच करें।</p>
                    </div>`;
            });
    }
</script>
</body>
</html>
