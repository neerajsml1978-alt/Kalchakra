<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <style>
        /* कंटेनर जो टीकर बॉक्स को व्यवस्थित करता है */
        .container {
            display: flex;
            gap: 10px;
            width: 100%;
            box-sizing: border-box;
            padding: 5px;
            margin: 0 auto;
            max-width: 900px;
        }

        /* टीकर बॉक्स की स्टाइलिंग */
        .ticker-box { 
            flex: 1; 
            min-width: 0; 
            overflow: hidden; 
            border: 1px solid #ddd; 
            border-radius: 12px; 
            padding: 8px 0; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); 
            white-space: nowrap;
            background-color: #ffffff;
        }
        
        .ticker-move { 
            display: inline-block;
            padding-left: 100%;
            animation: marquee 15s linear infinite; 
        }
        
        .ticker-item { 
            font-weight: bold; 
            font-size: 13px; 
            color: #c82333; 
            text-decoration: none; 
            cursor: pointer; 
            display: block;
        }
        
        @keyframes marquee { 
            0% { transform: translate(0, 0); } 
            100% { transform: translate(-100%, 0); } 
        }
    </style>
</head>
<body>

<div class="container">
    <!-- बॉक्स 1: राशिफल -->
    <div class="ticker-box">
        <div class="ticker-move">
            <a href="./rashifal/rashifal.html" class="ticker-item">✦आज का राशिफल✦</a>
        </div>
    </div>

    <!-- बॉक्स 2: उपाय -->
    <div class="ticker-box">
        <div class="ticker-move">
            <a href="./rashifal/upay.html" class="ticker-item">✦आज के अचूक उपाय✦</a>
        </div>
    </div>

    <!-- बॉक्स 3: पंचांग (यहाँ डेट पिकर ट्रिगर होगा) -->
    <div class="ticker-box">
        <div class="ticker-move">
            <!-- hiddenDatePicker का उपयोग कैलेंडर खोलने के लिए -->
            <input type="date" id="hiddenDatePicker" style="display:none;" onchange="redirectToPanchang(this.value)">
            <a href="javascript:void(0);" class="ticker-item" onclick="document.getElementById('hiddenDatePicker').showPicker();">✦आज का पंचांग✦</a>
        </div>
    </div>
</div>
</body>
</html>
