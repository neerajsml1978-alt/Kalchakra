<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{RASHI_NAME}} विशेष राशिफल</title>
    <link rel="stylesheet" href="style2.css">
    
    <!-- लाइब्रेरी -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- डाउनलोड फंक्शन फाइल -->
    <script src="download-button.js"></script>
</head>
<body>
    <div id="capture-area">
        <h1 style="text-align: center; color: #8b0000; margin: 20px 0;">
            {{RASHI_ICON}} {{RASHI_NAME}} भविष्यफल - <span id="current-date"></span>
        </h1>
        <div id="rashifal-container" class="grid-container">
            {{RASHI_CONTENT}}
        </div>
    </div>
    
    <script>
        window.addEventListener('load', function() {
            addDownloadButton('capture-area', 'rashifal.png');
        });
    </script>
</body>
</html>
